name: Build and Release

on:
  push:
    branches: [ master, main, feat/minimal-build ]
  pull_request:
    branches: [ master, main, feat/minimal-build ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_NAME: ReactUI
  PROJECT_DIR: ReactUI
  PROJECT_FILE: ReactUI
  CLAZAPI_VERSION: v1.13.7
  # Space-separated owner/repo@tag:asset.dll, e.g. ClazAU/au-reactui@v1.1.0:ReactUI.dll
  EXTRA_DLLS: ''
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/NuGet.config') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Get version from csproj
      id: get_version
      run: |
        csproj="$PROJECT_DIR/$PROJECT_FILE.csproj"
        version=$(grep -oP '<Version>\K[^<]+' "$csproj" || grep -oP '<VersionPrefix>\K[^<]+' "$csproj" || echo "1.0.0")
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "Version: $version"

    # Asks the remote because a depth-1 checkout never has tags that point at older commits.
    - name: Check if release needed
      id: check_release
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        tag=$(git ls-remote --tags origin "refs/tags/v$VERSION")
        if [ -n "$tag" ]; then
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "Tag v$VERSION already exists, skipping release"
        else
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "Will create release for v$VERSION"
        fi

    - name: List private dependency repos
      id: deps
      run: |
        repos="au-clazapi"
        for spec in $EXTRA_DLLS; do
          repo="${spec%%[@:]*}"
          case "$repo" in ClazAU/*) repos="$repos,${repo#ClazAU/}" ;; esac
        done
        echo "repos=$repos" >> $GITHUB_OUTPUT

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: ClazAU
        repositories: ${{ steps.deps.outputs.repos }}
        permission-contents: read

    - name: Download ClazAPI
      run: |
        mkdir -p /tmp/AmongUs/BepInEx/plugins
        gh release download "$CLAZAPI_VERSION" --repo ClazAU/au-clazapi --pattern 'ClazAPI.dll' --dir /tmp/AmongUs/BepInEx/plugins
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

    - name: Download extra plugin DLLs
      if: env.EXTRA_DLLS != ''
      run: |
        for spec in $EXTRA_DLLS; do
          source="${spec%%:*}"
          repo="${source%%@*}"
          tag="${source#*@}"
          if [ "$tag" = "$source" ]; then
            echo "::error::EXTRA_DLLS entry '$spec' has no @tag; pin the release it builds against"
            exit 1
          fi
          token="$APP_TOKEN"
          case "$repo" in ClazAU/*) ;; *) token="$DEFAULT_TOKEN" ;; esac
          GH_TOKEN="$token" gh release download "$tag" --repo "$repo" --pattern "${spec#*:}" --dir /tmp/AmongUs/BepInEx/plugins
        done
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        DEFAULT_TOKEN: ${{ github.token }}

    - name: Restore dependencies
      run: dotnet restore "$PROJECT_DIR/$PROJECT_FILE.csproj"

    # ILRepack resolves references through $(AmongUs)/BepInEx/core and /interop; stage every
    # restored package's lib DLLs there so the csproj's fixed search dirs are not needed on CI.
    - name: Stage BepInEx core and interop for ILRepack
      run: |
        mkdir -p /tmp/AmongUs/BepInEx/core /tmp/AmongUs/BepInEx/interop
        find ~/.nuget/packages -path '*/lib/*' -name '*.dll' -not -path '*amongus.gamelibs*' -exec cp -n {} /tmp/AmongUs/BepInEx/core/ \; 2>/dev/null || true
        find ~/.nuget/packages/amongus.gamelibs.steam -path '*/lib/*' -name '*.dll' -exec cp -n {} /tmp/AmongUs/BepInEx/interop/ \; 2>/dev/null || true
        ls /tmp/AmongUs/BepInEx/core | wc -l

    - name: Build
      run: dotnet build "$PROJECT_DIR/$PROJECT_FILE.csproj" --no-restore --configuration Release -p:AmongUs=/tmp/AmongUs

    # Same plugin without the JSX runtime, for mods that only use the C# API.
    - name: Build minimal
      run: |
        dotnet build "$PROJECT_DIR/$PROJECT_FILE.csproj" --no-restore --configuration Release -p:AmongUs=/tmp/AmongUs -p:Minimal=true -p:SkipDeploy=true -p:OutDir=$PROJECT_DIR/bin/Release/minimal/
        cp "$PROJECT_DIR/bin/Release/minimal/$PROJECT_NAME.dll" "$PROJECT_DIR/bin/Release/net6.0/$PROJECT_NAME.Minimal.dll"

    - name: Upload build artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}
        path: ${{ env.PROJECT_DIR }}/bin/Release/net6.0/${{ env.PROJECT_NAME }}.dll
        retention-days: 7

    # Runs before the release on purpose: a failed upload stops the job before the tag exists,
    # so the next run retries it instead of skipping a version the panel never received.
    - name: Upload to Panel API
      if: github.event_name != 'pull_request' && steps.check_release.outputs.should_release == 'true'
      env:
        PANEL_API_URL: ${{ secrets.PANEL_API_URL }}
        PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        if [ -z "$PANEL_API_URL" ] || [ -z "$PANEL_API_KEY" ]; then
          echo "::error::PANEL_API_URL or PANEL_API_KEY not configured"
          exit 1
        fi

        echo "Uploading $PROJECT_NAME v$VERSION to panel..."

        status=$(curl -sS --retry 2 --retry-delay 10 --max-time 300 -o response.txt -w '%{http_code}' \
          -X POST "$PANEL_API_URL/api/v3/mods/$PROJECT_NAME/versions" \
          -H "Authorization: Bearer $PANEL_API_KEY" \
          -F "version=$VERSION" \
          -F "notes=Built from ${{ github.sha }}" \
          -F "file=@$PROJECT_DIR/bin/Release/net6.0/$PROJECT_NAME.dll")

        cat response.txt
        case "$status" in
          2??) echo "Upload successful (HTTP $status)" ;;
          409) echo "::notice::v$VERSION is already on the panel" ;;
          404) echo "::warning::Mod '$PROJECT_NAME' is not registered on the panel; register it, then upload v$VERSION by hand or bump the version" ;;
          *)   echo "::error::Panel upload failed with HTTP $status; no release was created, re-run the workflow to retry"; exit 1 ;;
        esac

    - name: Create Release
      if: github.event_name != 'pull_request' && steps.check_release.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: ${{ env.PROJECT_NAME }} v${{ steps.get_version.outputs.version }}
        files: |
          ${{ env.PROJECT_DIR }}/bin/Release/net6.0/${{ env.PROJECT_NAME }}.dll
          ${{ env.PROJECT_DIR }}/bin/Release/net6.0/${{ env.PROJECT_NAME }}.Minimal.dll
        generate_release_notes: true
        draft: false
        prerelease: false
